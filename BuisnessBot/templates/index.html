{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Kernel | Чат</title>
</head>
<body>
    <section>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/."><img src="{% static 'imgs/logo.png' %}"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav col-md-4 offset-md-4">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Чат</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link " href="#">Возможности</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link " href="#">Цены</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link " href="https://t.me/BuisnessAIChatBot">Телеграм Бот</a>
                    </li>
                </ul>
                <a href="/./login/" class="col-md-3 offset-md-3">
                    <button class="btn btn-outline-success">Личный кабинет</button>
                </a>
                
                </div>
            </div>
        </nav>
    </section>

    <section class="card" style="margin-top: 50px; min-height: 30cap; padding-right: 5%; padding-left: 5%;">
        <div class="container-fluid text-center">
            <div class="row align-items-center">
                <form method="post">
                    <div class="container-fluid" style="padding-left: 10px; padding-right: 10px; padding-top: 10px; padding-bottom: 20px;">
                        <div class="input-group">
                            <div class="input-group">
                                {% csrf_token %}
                                <input name="question" type="text" class="form-control" placeholder="Введите свой вопрос..." aria-label="Введите свой вопрос..." aria-describedby="button-addon2">
                                <button class="btn btn-outline-secondary" type="submit" id="button-addon2">Отправить</button>
                            </div> 
                        </div>
                    </div>
                    <div>
                        <div style="text-align: left;">
                            {{ answer }}
                        </div>
                    </div> 
                </form>
            </div>
        </div>
    </section>

    <div class="container-fluid" style="padding-bottom: 0px; height: 100px;"> 
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"> 
            <p class="col-md-4 mb-0 text-body-secondary">© 2025, IT-cube Почеп</p> 
            <a href="/." class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none" aria-label="Bootstrap"> 
                <img src="{% static 'imgs/minilogo.png' %}">
            </a> 
            <ul class="nav col-md-4 justify-content-end"> 
                <li class="nav-item">
                    <a href="/." class="nav-link px-2 text-body-secondary">
                        Главная
                    </a>
                </li> 
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-body-secondary">
                        Возможности
                    </a>
                </li> 
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-body-secondary">
                        Цены
                    </a>
                </li> 
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-body-secondary">
                        FAQs
                    </a>
                </li> 
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-body-secondary">
                        О проекте
                    </a>
                </li> 
            </ul> 
        </footer> 
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
