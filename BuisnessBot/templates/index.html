<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Виртуальный Ассистент {Название}</title>
</head>
<body>
    <section>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Название</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav col-md-4 offset-md-4">
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Домашняя</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">Возможности</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="#">Цены</a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="https://t.me/BuisnessAIChatBot">Телеграм Бот</a>
                    </li>
                </ul>
                <button class="btn btn-outline-success col-md-1 offset-md-3">Войти</button>
                </div>
            </div>
        </nav>
        
    </section>

    <div class="container text-center" style="margin-top: 10%;">
    <div class="row align-items-center">
        <div class="col-5">
            <div class="input-group">
                    <form method="post">
                        <div class="input-group mb-3">
                            {% csrf_token %}
                            <input name="question" type="text" class="form-control" placeholder="Введите свой вопрос..." aria-label="Введите свой вопрос..." aria-describedby="button-addon2">
                            <button class="btn btn-outline-secondary" type="submit" id="button-addon2">Отправить</button>
                        </div>
                    </form>
                
            </div>
        </div>
        <div class="col">
        <div>
            {{ answer }}
        </div>
        </div>
    </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
